<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; color: #fff; font-family: sans-serif; margin: 0; padding: 0; font-size: 12px; }
        input, textarea { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; font-size: 12px; box-sizing: border-box; margin-bottom: 5px; }
        button { background: #00ffcc; color: #000; border: none; padding: 6px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .list { max-height: 100px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; margin-bottom: 8px; }
        .item { border-bottom: 1px solid #222; padding: 4px 0; }
    </style>
</head>
<body>
    <div class="list" id="box"></div>
    <input type="text" id="n" placeholder="Nama Anda...">
    <textarea id="i" placeholder="Tulis testimoni..." rows="2"></textarea>
    <button onclick="kirim()">Kirim Testimoni 🚀</button>

    <script>
        async function muat() {
            try {
                const res = await fetch('/api/komentar');
                const data = await res.json();
                const box = document.getElementById('box');
                if (box) {
                    box.innerHTML = '';
                    data.forEach(k => {
                        box.innerHTML += `<div class="item"><strong style="color:#00ffcc;">${k.nama}</strong> <span style="font-size:9px;color:#666;">(${k.waktu})</span><p style="margin:2px 0 0 0;color:#ddd;">${k.isi}</p></div>`;
                    });
                    box.scrollTop = box.scrollHeight;
                }
            } catch (e) { console.error(e); }
        }
        async function kirim() {
            const nama = document.getElementById('n').value;
            const isi = document.getElementById('i').value;
            if(!nama || !isi) return alert('Jangan kosong ya bang!');
            await fetch('/api/komentar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama, isi })
            });
            document.getElementById('n').value = '';
            document.getElementById('i').value = '';
            muat();
        }
        muat();
    </script>
</body>
</html>
